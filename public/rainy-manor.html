<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비 내리는 저택, 마지막 초대</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#f0e9da;background:#181b20;font:16px/1.6 system-ui,sans-serif}
main{width:min(1120px,100% - 36px);margin:auto;padding:40px 0}header p{margin:4px 0;color:#d3c4ab}h1,h2,h3{line-height:1.25}h1{font-size:clamp(27px,5vw,49px);margin:.2em 0}
nav,.grid,.actions{display:flex;gap:8px;flex-wrap:wrap}nav{margin:24px 0 12px}
button,select{font:inherit;padding:9px 13px;background:#30343c;color:inherit;border:1px solid #746d61;border-radius:6px}
button{cursor:pointer}button[aria-pressed=true],.primary{background:#e1c48c;color:#231c14}button:disabled{opacity:.48;cursor:default}button:focus-visible,select:focus-visible{outline:2px solid #ffe5ae;outline-offset:3px}
.layout{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}section,aside{padding:20px;background:#23272e;border:1px solid #53514c;border-radius:10px;min-width:0}section+section{margin-top:15px}
.grid{margin:14px 0}.grid button{flex:1 1 42%;min-height:58px;text-align:left}
#observation{min-height:100px;border-left:3px solid #b79459;padding:6px 14px;background:#1b1e24}
#observation p{margin:6px 0}#response{min-height:28px;color:#edcf96}li{margin-bottom:10px}ul{padding-left:22px}select{max-width:100%}.dim{color:#d3c4ab}[hidden]{display:none!important}
#alibi-cross{margin-top:14px}#alibi-cross fieldset{margin:0 0 8px;padding:8px 12px;border:1px solid #746d61;border-radius:6px}#alibi-cross label{display:block;width:fit-content;padding:4px 0;cursor:pointer}#alibi-cross input{accent-color:#e1c48c}.speaking.no-portrait{grid-template-columns:1fr;padding:12px}
fieldset{min-width:0;margin:8px 0;padding:8px 12px;border:1px solid #746d61;border-radius:6px}fieldset label{display:block;padding:5px 0;cursor:pointer}fieldset input{accent-color:#e1c48c}.comparison{margin-top:14px}.comparison p:empty,#poll-status:empty,#deduction-feedback:empty,#alibi-response:empty{display:none}
#deduction h2,.audience h2{margin:0;font-size:18px}.audience a{margin-left:8px;color:#e1c48c}#chat-status,#poll-status{color:#e5c997}.audience h3{margin:12px 0 4px}#poll-results{padding-left:18px}#poll-results li{margin-bottom:4px}
@media(max-width:740px){.layout{grid-template-columns:1fr}main{padding-top:24px}}
</style>
<link rel="stylesheet" href="rainy-manor-art/scenes.css">
<main>
<header class="case-header">
  <img class="detective-portrait" src="rainy-manor-art/detective-mongna.webp" alt="보라색 체크 탐정 모자를 쓴 몽나" width="768" height="702" fetchpriority="high">
  <div>
    <p id="chapter">1장 · 저택 조사</p>
    <h1>비 내리는 저택, 마지막 초대</h1>
    <p>20:00 정전. 20:30 전력이 돌아온 직후, 윤 집사가 서재에서 한태규를 발견했다.</p>
  </div>
</header>
<nav id="rooms" aria-label="조사할 장소"></nav>
<div class="layout"><div>
<section class="room-panel" aria-labelledby="room-title">
<figure class="scene"><img id="room-image" alt=""><figcaption id="room-title"></figcaption><div id="objects"></div></figure>
<div id="observation" aria-live="polite">그림 속 점을 눌러 물건을 조사하세요.</div>
</section>
<section class="interview"><h2>증언과 심문</h2><div id="questions" class="actions"></div>
<div id="speaking" class="speaking" hidden><img id="portrait" alt=""><p id="dialogue" aria-live="polite"><strong id="speaker-name"></strong><span id="speech"></span></p></div>
<form id="cross" hidden><label for="evidence">“불이 꺼지기 전에는 밖에 나간 적 없어요.”에 제시할 기록</label><div class="actions"><select id="evidence" required></select><button class="primary">증거 제시</button></div></form>
<form id="alibi-cross" hidden><fieldset><legend>오현석의 알리바이와 대조할 증언</legend>
<label><input type="checkbox" name="testimony" value="lawyer"> 최 변호사 · 정전 직후 약 10분</label>
<label><input type="checkbox" name="testimony" value="madam"> 서 여사 · 전기가 돌아오기 직전</label>
</fieldset><button class="primary">선택한 증언 제시</button><p id="alibi-response" role="status"></p></form>
<div id="clock-cross"></div><div id="investor-cross"></div><div id="archive-cross"></div>
<p id="response" role="status" tabindex="-1"></p></section>
<section id="deduction" hidden aria-labelledby="deduction-title">
<h2 id="deduction-title">최종 추리</h2>
<form id="deduction-form"><fieldset id="deduction-options"></fieldset><button class="primary">선택 확정</button></form>
<p id="deduction-feedback" role="status"></p><div id="ending" hidden><h3>마지막 초대</h3><p id="ending-proof"></p><p id="ending-butler"></p><p id="ending-mongna"></p><button id="restart" type="button">처음부터 다시 조사</button></div>
</section>
<section class="audience" aria-labelledby="audience-title">
<h2 id="audience-title">시청자 투표</h2>
<p id="chat-status">방송에서 원할 때 SOOP 채팅을 연결할 수 있어요.</p>
<button id="connect-chat" type="button">SOOP 채팅 연결</button>
<a id="auth-link" href="/streamer/minigames" target="_blank" rel="noopener" hidden>SOOP 계정 연결 열기</a>
<div id="poll-rounds" class="actions"></div>
<div id="poll" hidden><h3 id="poll-title"></h3><form id="poll-form"><fieldset id="poll-options"></fieldset><button class="primary">내 선택 봉인 · 투표 시작</button></form>
<p id="poll-status" role="status"></p><ul id="poll-results" hidden></ul><button id="poll-skip" type="button">바로 넘어가기</button></div>
</section>
</div><aside><h2>사건 노트</h2><p id="empty" class="dim">조사 중 확인한 단서와 증언이 여기에 기록됩니다.</p><ul id="notes"></ul></aside></div>
</main>
<script>
const rooms = {
  '서재': [
    ['lamp','책상 위 스탠드','스탠드다.'],
    ['books','책장','오래된 책들이 빼곡히 꽂혀 있다.'],
    ['glasses','안경','한태규의 안경이다. 렌즈는 깨지지 않았다.'],
    ['clock','서재 벽시계','태엽으로 움직이는 괘종시계다.', '집사님이 봤다는 게 이거네. 정전 때도 움직였는지 확인해 봐야겠다.', 'butler',
      '윤 집사의 퇴실 진술에 쓰인 태엽시계. 표시 시각은 19:50.'],
    ['report','서재 탁자의 검시 소견서','서재 탁자에 검시 소견서가 놓여 있다.', '둥근 모서리와 푸른 금속 흔적이라. 수장고에서 비슷한 게 있었는지 보자.', 'archive-refuted',
      '사인은 뒤통수에 받은 충격. 소견서에는 둥근 모서리와 푸른 금속 흔적이 기록되어 있다. 사망 시각은 저녁 8시 전후로 폭넓게 추정된다.'],
    ['receipt','책상 서랍의 수리 영수증','사흘 전 영수증이다. ‘서재 괘종 20분 지연. 부품 대기 중.’', '사흘 전에도 스무 분 느렸네. 오늘도 그랬는지 비교해 보자.'],
    ['recording','책장 녹화 기록','시설 카메라의 기록이다. 배터리로 전환된 뒤에도 시각과 영상이 연속으로 남아 있다.', '불이 돌아온 순간이 찍혔네. 화면에 나온 두 시각을 비교해 보자.', 'clock-source',
      '복구 기록과 일치하는 카메라 시각은 20:30. 같은 화면의 서재 괘종시계는 20:10. 영상에서 괘종시계는 정전 중에도 계속 작동한다.'],
  ],
  '현관': [
    ['umbrella','젖은 우산','젖은 우산이다.'],
    ['shoes','신발장','손님용 슬리퍼 몇 켤레가 놓여 있다.'],
    ['coat','옷걸이의 젖은 외투','외투 소매가 젖어 있다.', '언제 입고 나갔는지 지민 씨한테 물어봐야겠다.'],
    ['envelope','우편함 속 고지서','전력회사 고지서다.'],
  ],
  '수장고': [
    ['case','진열장 속 청동 문진','오래된 수집품 가운데 청동 문진이 놓여 있다.', '둥글게 닳았고 푸른 녹청이 있어. 자물쇠에도 같은 빛깔이었지.', 'archive-refuted',
      '청동 문진에는 둥근 모서리와 푸른 녹청이 있다. 자물쇠에도 같은 빛깔의 녹청이 있다.'],
    ['lighter','문 앞 바닥의 라이터','바닥에 은색 라이터가 떨어져 있다.', 'O.H.S.라고 새겨져 있네. 오현석 씨에게 보여주자.', 'alibi-gap',
      '수장고 문 앞에서 찾은 라이터에 오현석의 영문 이니셜이 새겨져 있다. 언제 떨어졌는지는 확인되지 않았다.'],
    ['files','서류함','서류 몇 장이 쌓여 있다.'],
    ['lock','자물쇠가 걸린 문','청동 자물쇠에 푸른 녹청이 묻어 있다.', '이 자물쇠 열쇠는 누가 갖고 있지?'],
    ['sale','매각 관련 서류','저택 매각을 검토한다는 서류다.', '저택이 팔리면 여기서 일하는 사람들한테도 영향이 있겠어.'],
  ],
  '응접실·복도': [
    ['sofa','응접실 소파','손님들이 앉아 있던 자리다.'],
    ['hall-clock','복도 벽시계','복도 전기시계가 20:00에 멈춰 있다. 정전 뒤 수동으로 맞춰야 하는 시계다.', '이 시계는 불이 나간 때를 보여줘.'],
    ['letter','복도 서랍 속 편지','서랍에 수신인 이름이 없는 편지 봉투가 있다.', '지민 씨랑 소윤 씨가 주고받은 편지네. 그래서 같이 있었다는 걸 숨겼구나.', 'resolved',
      '편지에서 두 사람이 관계를 비밀로 해 왔다는 사실을 확인했다.'],
    ['cloth','세탁 바구니 속 손수건','모서리가 찢어진 손수건이다. 푸른 얼룩 옆에 ‘윤’이라는 이름이 수놓여 있다.', '한쪽 모서리가 통째로 없네. 그 조각은 어디 갔을까?', 'archive-open',
      '윤 집사의 손수건. 찢어진 모서리와 자물쇠에서 본 것과 비슷한 푸른 얼룩이 있다.'],
  ],
};
const art = {
  '서재': ['study', [[94,51],[18,37],[70,83],[54,22],[61,66],[82,68],[27,52]]],
  '현관': ['foyer', [[33,69],[22,63],[83,44],[94,46]]],
  '수장고': ['archive', [[17,45],[75,88],[53,63],[83,43],[85,77]]],
  '응접실·복도': ['lounge', [[19,66],[53,20],[62,59],[88,74]]],
};
const portraits = {'윤 집사':'butler','오현석':'investor','한지민':'guest','강소윤':'witness'};
const flags = new Set();
const notes = new Map();
const noteElements = new Map();
const el = id => document.getElementById(id);
let room = '서재';
function button(label, click) {
  const node = document.createElement('button');
  node.type = 'button'; node.textContent = label; node.addEventListener('click', click);
  return node;
}
function line(to, value) {
  const p = document.createElement('p'); p.textContent = value; to.append(p);
}
function record(id, title, detail, canPresent = true) {
  if (notes.has(id)) return;
  notes.set(id, title);
  const item = document.createElement('li');
  noteElements.set(id, item);
  const name = document.createElement('strong');
  name.textContent = title;
  item.append(name, document.createElement('br'), document.createTextNode(detail));
  el('notes').append(item); el('empty').hidden = true;
  if (!canPresent) return;
  const option = document.createElement('option');
  option.value = id; option.textContent = title;
  el('evidence').append(option);
}
function reviseNote(id, title, detail) {
  const item = noteElements.get(id);
  item.firstChild.textContent = title;
  item.lastChild.textContent = detail;
}
function inspect([id,title,description,brief,condition,note], selected) {
  for (const item of el('objects').children) item.setAttribute('aria-pressed', String(item === selected));
  const box = el('observation');
  box.replaceChildren();
  line(box, id === 'cloth' && !flags.has('archive-open') ? '바구니에 손수건이 하나 들어 있다.' : description);
  if (brief && (!condition || flags.has(condition))) {
    line(box, '몽나 · ' + brief);
    flags.add(id);
    record(id, title, note || description);
    renderQuestions();
  }
  if (id === 'glasses' && flags.has('found-scene') && flags.has('archive-refuted')) {
    line(box, '몽나 · 안경 옆에 한태규 씨가 쥐고 있던 천 조각이 있어. 찢어진 가장자리에 흰색 감침질이 남아 있네.');
    flags.add('fragment');
    record('fragment', '한태규가 쥐고 있던 천 조각', '서 여사가 발견 직후 한태규의 손에서 본 천 조각. 찢어진 가장자리 끝에 흰색 감침질이 남아 있다.', false);
    renderQuestions();
  }
}
function renderRoom() {
  el('room-title').textContent = room;
  el('rooms').replaceChildren(...Object.keys(rooms).map(name => {
    const node = button(name, () => { room = name; renderRoom(); });
    node.setAttribute('aria-pressed', String(name === room));
    return node;
  }));
  const [scene, spots] = art[room];
  el('room-image').src = 'rainy-manor-art/' + scene + '.webp';
  el('objects').replaceChildren(...rooms[room].map((prop, index) => {
    const node = button('', () => inspect(prop, node));
    const label = document.createElement('span');
    label.className = 'object-label';
    label.textContent = prop[1];
    label.setAttribute('aria-hidden', 'true');
    node.append(label);
    node.setAttribute('aria-label', prop[1]);
    node.setAttribute('aria-pressed', 'false');
    node.style.setProperty('--x', spots[index][0] + '%');
    node.style.setProperty('--y', spots[index][1] + '%');
    if (spots[index][0] > 78) node.classList.add('marker-right');
    return node;
  }));
  el('observation').textContent = '그림 속 점을 눌러 물건을 조사하세요.';
}
function speak(name, reply) {
  const portrait = portraits[name];
  el('portrait').hidden = !portrait;
  el('speaking').classList.toggle('no-portrait', !portrait);
  if (portrait) el('portrait').src = 'rainy-manor-art/' + portrait + '.webp';
  else el('portrait').removeAttribute('src');
  el('speaker-name').textContent = name;
  el('speech').textContent = reply;
  el('speaking').hidden = false;
}
function ask(id, name, reply, detail = reply, canPresent = true) {
  flags.add(id);
  speak(name, reply);
  el('response').textContent = '';
  el('alibi-response').textContent = '';
  record(id, name + '의 진술', detail, canPresent);
  renderQuestions();
}
function renderQuestions() {
  const options = [
    button('윤 집사 · 언제 서재를 나왔어요?', () => ask('butler','윤 집사','차를 올리고 나올 때 서재 시계로 7시 50분쯤이었을 겁니다. 어르신이 아직 따뜻할 때 마시겠다고 직접 말씀하셨지요.')),
    button('오현석 · 정전 때 어디 계셨어요?', () => ask('alibi','오현석','나는 정전 내내 응접실에 있었소. 다른 손님들이 증인이지.', '응접실에 계속 있었다고 주장함. 목격자와 시간대 확인 필요.')),
  ];
  if (flags.has('coat')) options.push(button('한지민 · 외투는 언제 젖었어요?', () => ask('denial','한지민',
    flags.has('resolved') ? '7시 반에 소윤이랑 함께 있었어요.' : '불이 꺼지기 전에는 밖에 나간 적 없어요.')));
  if (flags.has('denial')) options.push(button('강소윤 · 정전 전에는 어디 있었어요?', () => ask('witness','강소윤',
    '7시 반쯤 현관문 바깥에 있었어요. 지민 씨랑 같이 있었거든요.')));
  if (flags.has('butler')) options.push(button('윤 집사 · 어느 시계를 보셨어요?', () => ask('clock-source','윤 집사',
    '서재 벽에 걸린 괘종시계입니다. 정전되기 전부터 책상에 있던 초에 불이 켜져 있어서, 촛불로 봤습니다.',
    '윤 집사가 말한 7시 50분은 서재 괘종시계에 표시된 시각이다.', false)));
  if (flags.has('alibi')) options.push(button('오현석 · 정전 내내요?', () => ask('alibi-claim','오현석',
    '불이 꺼지고 다시 들어올 때까지요. 삼십 분 내내 거기 있었소.',
    '오현석은 20:00부터 20:30까지 계속 응접실에 있었다고 주장한다.', false)));
  if (flags.has('alibi-claim')) {
    options.push(button('최 변호사 · 언제까지 같이 계셨어요?', () => ask('lawyer','최 변호사',
      '불이 나가고 처음 십 분쯤은 같이 있었어요. 둘이 더듬거리면서 촛대를 찾았거든요. 그 뒤엔 제가 자리를 비웠습니다.',
      '정전 직후부터 약 10분 동안 오현석과 응접실에 함께 있었다.', false)));
    options.push(button('서 여사 · 언제 오현석 씨를 보셨어요?', () => ask('madam','서 여사',
      '창가에서 한참 비를 보고 있었어요. 오 선생이랑 카드를 시작한 건 불이 다시 들어오기 조금 전이에요.',
      '전기가 돌아오기 조금 전부터 오현석과 응접실에서 카드놀이를 했다.', false)));
  }
  if (flags.has('clock-checked')) {
    options.push(button('최 변호사 · 정전 무렵 한태규 씨를 만나셨나요?', () => ask('last-alive','최 변호사',

function choices(fieldset, legend, name, entries, type) {
  const heading = document.createElement('legend');
  heading.textContent = legend;
  fieldset.replaceChildren(heading);
  for (const [value, title] of entries) {
    const label = document.createElement('label');
    const input = document.createElement('input');
    Object.assign(input, { type, name, value, required: type === 'radio' });
    label.append(input, document.createTextNode(' ' + title));
    fieldset.append(label);
  }
}
function showComparison(containerId, prompt, ids, check, type = 'checkbox') {

  const fieldset = document.createElement('fieldset');
  choices(fieldset, prompt, 'evidence', ids.filter(id => notes.has(id)).map(id => [id, notes.get(id)]), type);

  submit.className = 'primary';
  submit.textContent = '선택한 증거 제시';

function startPoll(pick, onFinish) {

  if (!chatConnected) {

    el('poll-status').textContent = '몽나의 선택은 봉인됐어요. 채팅에 !추리 1~4 · ' + remaining + '초 남음';

  const { pick, votes, timer, onFinish } = activePoll;
  activePoll = null;
  clearInterval(timer);
  const counts = [0,0,0,0];
  for (const vote of votes.values()) counts[vote] += 1;
  pollHistory.set(pollRound, { pick, counts, total: votes.size });
  renderPollResults();
  el('poll-skip').textContent = '닫기';
  onFinish?.();
}
function renderPollResults() {
  const result = pollHistory.get(pollRound);
  if (!result || el('poll').hidden) return;
  const { pick, counts, total } = result;
  el('poll-status').textContent = '몽나의 선택 · ' + suspects[pick] + (total ? '' : ' · 이번엔 조용하네.');
  const list = el('poll-results');
  list.replaceChildren();
  list.hidden = !total;
  const first = pollRound === 2 ? pollHistory.get(1) : null;
  if (!total) return;
  suspects.forEach((name, index) => {
    const li = document.createElement('li');
    const percent = Math.round(100 * counts[index] / total);
    const previous = first?.total >= 3 && total >= 3 ? ' · 1장 ' + Math.round(100 * first.counts[index] / first.total) + '%' : '';
    li.textContent = name + ' · ' + (total < 3 ? counts[index] + '표' : percent + '%') + previous;
    list.append(li);
  });
  if (pollRound === 3 && !el('ending').hidden && total > 0) {
    const li = document.createElement('li');
    li.textContent = '채팅 적중 · ' + counts[3] + '/' + total + '표';
    list.append(li);
  }
}
el('poll-form').addEventListener('submit', event => {
  event.preventDefault();
  startPoll(Number(new FormData(event.currentTarget).get('suspect')));
});
el('poll-skip').addEventListener('click', () => {
  if (activePoll) { finishPoll(); return; }
  el('poll').hidden = true;
  (el('poll-' + pollRound) || el('deduction-form').querySelector('button')).focus();
});
el('connect-chat').addEventListener('click', () => {
  if (chatFrame) chatFrame.remove();
  chatConnected = false;
  el('chat-status').textContent = 'SOOP 채팅 연결을 확인하고 있습니다.';
  el('auth-link').hidden = true;
  chatFrame = document.createElement('iframe');
  chatFrame.title = 'SOOP 채팅 연결';
  chatFrame.hidden = true;
  chatFrame.src = '/streamer/rainy-manor-chat';
  document.body.append(chatFrame);
});
window.addEventListener('message', event => {
  if (!chatFrame || event.origin !== location.origin || event.source !== chatFrame.contentWindow) return;
  const data = event.data;
  if (data?.type === 'rainy-manor-chat-state') {
    chatConnected = data.connected === true;
    el('chat-status').textContent = data.status;
    el('auth-link').hidden = data.authenticated === true || chatConnected;
    if (!chatConnected) finishPoll();
  }
  if (data?.type !== 'rainy-manor-vote' || !chatConnected || !activePoll || Date.now() >= activePoll.deadline) return;
  if (typeof data.userId !== 'string' || !data.userId || !/^[1-4]$/.test(data.vote)) return;
  activePoll.votes.set(data.userId, Number(data.vote) - 1);
});

renderRoom();
renderQuestions();
</script>
</html>
