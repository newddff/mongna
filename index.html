<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>몽나 홈페이지</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
<style>
  :root {
    --primary: #a855f7; 
    --primary-light: #f3e8ff; 
    --card-bg: #ffffff;
    --text-main: #1e293b;
    --text-sub: #64748b;
  }

  body {
    background: linear-gradient(180deg, #f5f3ff 0%, #ffffff 100%);
    color: var(--text-main);
    margin: 0;
    font-family: 'Pretendard', sans-serif;
    min-height: 100vh;
  }

  /* --- 상단 네비게이션 --- */
  .top-bar {
    height: 70px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 40px; position: sticky; top: 0; z-index: 100;
    background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(168, 85, 247, 0.1);
  }
  
  .logo-wrap {
    display: flex; align-items: center; text-decoration: none;
    transition: 0.2s;
  }
  .logo-wrap:hover { transform: scale(1.02); }
  .logo-img {
    height: 40px; 
    object-fit: contain;
  }

  .nav-menu { display: flex; gap: 30px; font-weight: 800; color: var(--text-main); font-size: 15px;}
  .nav-menu a { text-decoration: none; color: inherit; transition: 0.2s; position: relative;}
  .nav-menu a:hover, .nav-menu a.active { color: var(--primary); }
  .nav-menu a.active::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 100%; height: 3px; background: var(--primary); border-radius: 2px;}

  .right-menu { display: flex; gap: 15px; align-items: center; }
  .live-badge { background: #fee2e2; color: #ef4444; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 6px; }
  .live-badge::before { content: ''; display: block; width: 8px; height: 8px; background: #ef4444; border-radius: 50%; animation: blink 1.5s infinite; }
  @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0;} 100% {opacity: 1;} }

  .admin-btn { background: white; border: 1px solid #ddd; padding: 6px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; color: var(--text-main); transition: 0.2s; }
  .admin-btn.on { background-color: #ffd700; border-color: #ffd700; color: #333; }
  .admin-settings-btn { background: #f1f5f9; border: none; font-size: 18px; cursor: pointer; display: none; border-radius: 50%; width: 36px; height: 36px; align-items: center; justify-content: center; transition: 0.2s; }
  .admin-settings-btn:hover { background: #e2e8f0; transform: rotate(45deg); }

  /* --- 메인 레이아웃 --- */
  .main-container {
    max-width: 1500px; margin: 40px auto; padding: 0 40px;
    display: flex; gap: 60px; align-items: flex-start;
  }

  .left-hero {
    flex: 1; position: sticky; top: 110px; 
    height: calc(100vh - 150px); min-height: 500px; display: flex; 
  }
  .hero-main-img {
    width: 100%; height: 100%; border-radius: 32px; box-shadow: 0 20px 50px rgba(168, 85, 247, 0.15);
    object-fit: cover; object-position: center 25%;
    background: white; border: 6px solid white; box-sizing: border-box;
  }

  .right-content {
    flex: 1.2; min-width: 0; display: flex; flex-direction: column; gap: 50px; padding-bottom: 60px;
  }

  /* --- 일정 카드 (이번 주 일정) --- */
  .info-card { background: var(--card-bg); border-radius: 24px; padding: 35px; box-shadow: 0 10px 40px rgba(0,0,0,0.03); }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
  .card-header h3 { margin: 0; font-size: 20px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
  .more-btn { font-size: 14px; color: var(--text-sub); text-decoration: none; background: #f1f5f9; padding: 8px 16px; border-radius: 20px; font-weight: bold; transition: 0.2s;}
  .more-btn:hover { background: #e2e8f0; color: #333; }

  .week-calendar-wrap { width: 100%; overflow-x: auto; padding-bottom: 10px; }
  .week-calendar-wrap::-webkit-scrollbar { height: 8px; }
  .week-calendar-wrap::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

  .week-calendar-grid { 
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; min-width: 800px; 
  }

  .day-cell {
    border: 1px solid #f1f5f9; border-radius: 16px; padding: 12px; 
    background: #ffffff; min-height: 140px; display: flex; flex-direction: column; gap: 8px;
    transition: 0.2s;
  }
  .day-cell:hover { border-color: #cbd5e1; box-shadow: 0 5px 15px rgba(0,0,0,0.03); }
  .day-cell.today { background-color: var(--primary-light); border-color: var(--primary); box-shadow: 0 4px 15px rgba(168, 85, 247, 0.15); }

  .date-header { font-size: 16px; font-weight: 900; margin-bottom: 5px; }
  .date-sun { color: #ef4444; } 
  .date-sat { color: #3b82f6; } 
  .date-weekday { color: var(--text-main); }

  .event-block { border-radius: 8px; padding: 8px; color: white; font-size: 13px; line-height: 1.3; }
  .event-time { background: rgba(0,0,0,0.15); display: inline-block; padding: 2px 6px; border-radius: 6px; font-size: 11px; font-weight: 900; margin-bottom: 5px; }
  .event-title { font-weight: bold; word-break: keep-all; }

  .evt-방송 { background-color: #fb819e; } 
  .evt-겜방 { background-color: #fbbf24; } 
  .evt-합방 { background-color: #60a5fa; } 
  .evt-휴방 { background-color: #94a3b8; } 

  /* --- 공통 섹션 타이틀 --- */
  .section-title { font-size: 22px; font-weight: 900; margin-bottom: 20px; color: #1e293b; display: flex; align-items: center; gap: 8px; }

  /* --- 몽튜브 썸네일 --- */
  .youtube-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .yt-card { background: var(--card-bg); border-radius: 20px; padding: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.03); transition: 0.2s; cursor: pointer; text-decoration: none; color: inherit; display: flex; flex-direction: column;}
  .yt-card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.08); border: 1px solid var(--primary-light); }
  .yt-thumb { width: 100%; aspect-ratio: 16/9; background: #f1f5f9; border-radius: 12px; margin-bottom: 15px; object-fit: cover; }
  .yt-title { font-size: 15px; font-weight: bold; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* --- 몽나링크 --- */
  .shortcut-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
  .shortcut-btn {
    background: var(--card-bg); border-radius: 20px; padding: 22px; display: flex; align-items: center; gap: 15px;
    text-decoration: none; color: var(--text-main); box-shadow: 0 10px 40px rgba(0,0,0,0.03); transition: 0.2s; position: relative; border: 1px solid transparent;
  }
  .shortcut-btn:hover { transform: translateY(-3px); border-color: var(--primary); box-shadow: 0 10px 40px rgba(168, 85, 247, 0.15); }
  
  .shortcut-icon { width: 45px; height: 45px; border-radius: 14px; object-fit: cover; background: #f1f5f9; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  
  .shortcut-texts { display: flex; flex-direction: column; }
  .sc-title { font-size: 16px; font-weight: 900; margin-bottom: 4px; }
  .sc-sub { font-size: 13px; color: var(--text-sub); }
  .sc-arrow { position: absolute; right: 25px; color: #cbd5e1; font-weight: bold; transition: 0.2s;}
  .shortcut-btn:hover .sc-arrow { color: var(--primary); transform: translateX(3px); }

  /* --- 👑 관리자 설정 모달 --- */
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0, 0, 0, 0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
  .modal-content { background-color: white; border-radius: 24px; width: 650px; max-width: 90vw; max-height: 90vh; overflow-y: auto; padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.25); position: relative; }
  .modal-close-btn { position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 24px; color: #888; cursor: pointer; transition: 0.2s; }
  .modal-close-btn:hover { color: #333; }
  
  .s-title { font-size: 20px; font-weight: 900; color: var(--primary); margin-top: 0; margin-bottom: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
  .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
  .input-group label { font-size: 14px; font-weight: bold; color: #475569; }
  .input-group input { padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-family: inherit; font-size: 14px; outline: none; }
  .input-group input:focus { border-color: var(--primary); }
  
  .link-setting-box { background: #f8fafc; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #e2e8f0;}
  .link-setting-box .box-title { font-weight: bold; margin-bottom: 10px; color: var(--primary); }
  
  .modal-save-btn { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; transition: 0.2s; }
  .modal-save-btn:hover { filter: brightness(0.9); }

  /* 💡 📱 모바일 가시성 최적화 (메뉴바 수정됨) */
  @media (max-width: 1024px) {
    .top-bar { 
      padding: 10px 20px; 
      height: auto; 
      flex-wrap: wrap; /* 요소들이 좁으면 밑으로 내려가게 함 */
    }
    .logo-wrap { order: 1; }
    .right-menu { order: 2; }
    
    /* 사라졌던 메뉴를 다시 나타나게 하고 두 번째 줄에 배치 */
    .nav-menu { 
      display: flex; 
      order: 3; 
      width: 100%; 
      justify-content: center; 
      gap: 15px; 
      padding-top: 12px; 
      margin-top: 8px; 
      border-top: 1px solid rgba(168, 85, 247, 0.1); 
      overflow-x: auto; /* 메뉴가 길면 좌우로 스크롤 가능 */
      white-space: nowrap; 
      font-size: 14px;
    }
    .nav-menu::-webkit-scrollbar { display: none; } /* 모바일에서 스크롤바 안 보이게 숨김 */
    
    .main-container { flex-direction: column; padding: 0 20px; gap: 30px; margin: 20px auto; }
    
    .left-hero { flex: none; position: static; width: 100%; height: 400px; min-height: auto; margin-bottom: -10px;}
    .hero-main-img { border-radius: 20px; border-width: 4px; }

    .right-content { width: 100%; gap: 35px; padding-bottom: 30px;}

    .info-card { padding: 20px; border-radius: 20px; }
    
    .youtube-grid { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 15px; gap: 15px; scrollbar-width: none; }
    .youtube-grid::-webkit-scrollbar { display: none; }
    .yt-card { flex: 0 0 85%; scroll-snap-align: start; min-width: 250px; }
    
    .shortcut-grid { grid-template-columns: 1fr; gap: 12px;}
    .shortcut-btn { padding: 15px 20px; border-radius: 16px; }
  }
</style>
</head>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDAdur1FhGkbibSexAu0xCjlQyFzQcQCso",
    authDomain: "mongna-vod.firebaseapp.com",
    projectId: "mongna-vod",
    storageBucket: "mongna-vod.firebasestorage.app",
    messagingSenderId: "310663611402",
    appId: "1:310663611402:web:1d607304ce4d7331b5cbf3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  
  const scheduleRef = doc(db, 'mongna_calendar_data', 'schedule_data');
  const homeRef = doc(db, 'mongna_calendar_data', 'home_settings_v2'); 

  let isAdmin = localStorage.getItem('mongna_home_admin') === 'true';
  
  let homeData = {
    heroImg: '', ytChannelId: '', isLive: false,
    links: [
      { title: '숲 방송국', sub: '생방송 보러가기', icon: 'https://cdn-icons-png.flaticon.com/512/3159/3159073.png', url: 'https://www.sooplive.com/station/pinktape8' },
      { title: '유튜브', sub: '다시보기 & 하이라이트', icon: 'https://cdn-icons-png.flaticon.com/512/1384/1384060.png', url: 'https://www.youtube.com/@mongnaaa' },
      { title: '팬카페', sub: '소통과 정보 나눔', icon: 'https://cdn-icons-png.flaticon.com/512/3054/3054889.png', url: 'https://cafe.naver.com/nightofmongna' },
      { title: '인스타그램', sub: '일상 공유', icon: 'https://cdn-icons-png.flaticon.com/512/1384/1384063.png', url: 'https://www.instagram.com/m0n9na/' }
    ]
  };

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  // 홈 설정 데이터 연동
  onSnapshot(homeRef, (docSnap) => {
    if (docSnap.exists()) {
      homeData = docSnap.data();
      if(!homeData.links || homeData.links.length === 0) {
        homeData.links = [
          { title: '숲 방송국', sub: '생방송 보러가기', icon: 'https://cdn-icons-png.flaticon.com/512/3159/3159073.png', url: 'https://www.sooplive.com/station/pinktape8' },
          { title: '유튜브', sub: '다시보기 & 하이라이트', icon: 'https://cdn-icons-png.flaticon.com/512/1384/1384060.png', url: 'https://www.youtube.com/@mongnaaa' },
          { title: '팬카페', sub: '소통과 정보 나눔', icon: 'https://cdn-icons-png.flaticon.com/512/3054/3054889.png', url: 'https://cafe.naver.com/nightofmongna' },
          { title: '인스타그램', sub: '일상 공유', icon: 'https://cdn-icons-png.flaticon.com/512/1384/1384063.png', url: 'https://www.instagram.com/m0n9na/' }
        ];
      }
    }
    renderHomePage();
  });

  function fetchYouTubeVideos(channelId) {
    const ytGrid = document.getElementById('youtubeGrid');
    if (!channelId) {
      ytGrid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #94a3b8; font-size: 14px; font-weight: bold; padding: 40px 0; background: white; border-radius: 20px;">유튜브 채널 ID가 등록되지 않았습니다. 관리자 설정(⚙️)을 확인해주세요.</div>`;
      return;
    }

    const rssUrl = encodeURIComponent(`https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`);
    const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`;

    fetch(apiUrl)
      .then(response => response.json())
      .then(data => {
        if (data.status === 'ok' && data.items.length > 0) {
          const latestVideos = data.items.slice(0, 3);
          let ytHtml = '';
          latestVideos.forEach(video => {
            ytHtml += `
              <a href="${video.link}" target="_blank" class="yt-card">
                <img src="${video.thumbnail}" class="yt-thumb">
                <div class="yt-title">${escapeHtml(video.title)}</div>
              </a>
            `;
          });
          ytGrid.innerHTML = ytHtml;
        } else {
          ytGrid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #ef4444; font-size: 14px; font-weight: bold; padding: 40px 0; background: white; border-radius: 20px;">유튜브 영상을 불러오지 못했습니다. 채널 ID를 확인해주세요.</div>`;
        }
      })
      .catch(error => { console.error("유튜브 로드 에러:", error); });
  }

  function renderHomePage() {
    // 메인 이미지
    const mainImg = document.getElementById('heroMainImg');
    if(homeData.heroImg) mainImg.src = homeData.heroImg;

    // 관리자가 켠 방송중 스위치 상태 불러오기
    document.getElementById('liveBadge').style.display = homeData.isLive ? 'flex' : 'none';

    // 유튜브
    fetchYouTubeVideos(homeData.ytChannelId);

    // 링크
    const linkGrid = document.getElementById('shortcutGrid');
    let linkHtml = '';
    homeData.links.forEach(link => {
      const iconContent = link.icon ? `<img src="${escapeHtml(link.icon)}" style="width:100%; height:100%; border-radius:10px; object-fit:cover;">` : `🔗`;
      
      linkHtml += `
        <a href="${escapeHtml(link.url || '#')}" target="_blank" class="shortcut-btn">
          <div class="shortcut-icon">${iconContent}</div>
          <div class="shortcut-texts">
            <div class="sc-title">${escapeHtml(link.title || '링크 제목')}</div>
            <div class="sc-sub">${escapeHtml(link.sub || '설명글')}</div>
          </div>
          <div class="sc-arrow">↗</div>
        </a>
      `;
    });
    linkGrid.innerHTML = linkHtml;
  }

  // --- 캘린더 '이번 주 일정' 연동 ---
  const todayObj = new Date();
  const todayStr = `${todayObj.getFullYear()}-${todayObj.getMonth() + 1}-${todayObj.getDate()}`;

  const currentDay = todayObj.getDay(); 
  const sunday = new Date(todayObj.getTime());
  sunday.setDate(todayObj.getDate() - currentDay);

  let thisWeekKeys = [];
  for(let i = 0; i < 7; i++) {
    const d = new Date(sunday.getFullYear(), sunday.getMonth(), sunday.getDate() + i);
    thisWeekKeys.push({
      key: `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`,
      dateNum: d.getDate(),
      dayIdx: d.getDay()
    });
  }

  onSnapshot(scheduleRef, (docSnap) => {
    const listContainer = document.getElementById('thisWeekScheduleList');
    if (docSnap.exists()) {
      const allData = docSnap.data().data || {};
      let html = '';

      thisWeekKeys.forEach(dayObj => {
        const daySchedules = allData[dayObj.key] || [];
        const isToday = (dayObj.key === todayStr);
        
        let dateColorClass = 'date-weekday';
        if(dayObj.dayIdx === 0) dateColorClass = 'date-sun';
        else if(dayObj.dayIdx === 6) dateColorClass = 'date-sat';

        html += `<div class="day-cell ${isToday ? 'today' : ''}">`;
        html += `<div class="date-header ${dateColorClass}">${dayObj.dateNum}</div>`;
        
        daySchedules.forEach(sch => {
          let evtClass = 'evt-방송';
          if(sch.type === '겜방') evtClass = 'evt-겜방';
          if(sch.type === '휴방') evtClass = 'evt-휴방';
          if(sch.type === '합방') evtClass = 'evt-합방';

          html += `
            <div class="event-block ${evtClass}">
              <div class="event-time">[${escapeHtml(sch.time || '미정')}]</div>
              <div class="event-title">${escapeHtml(sch.title)}</div>
            </div>
          `;
        });
        
        html += `</div>`; 
      });

      listContainer.innerHTML = html;
    }
  });

  // --- 관리자 기능 ---
  window.toggleAdmin = function() {
    if(isAdmin) {
      if(confirm("관리자 모드를 종료하시겠습니까?")) {
        isAdmin = false; localStorage.removeItem('mongna_home_admin'); updateAdminUI();
      }
    } else {
      const pwd = prompt("관리자 비밀번호 입력:");
      if(pwd === "mongna1234") {
        isAdmin = true; localStorage.setItem('mongna_home_admin', 'true');
        alert("관리자 인증 성공!"); updateAdminUI();
      } else if(pwd) { alert("비밀번호 오류"); }
    }
  };

  function updateAdminUI() {
    const btn = document.getElementById('adminToggleBtn');
    const setBtn = document.getElementById('adminSettingsBtn');
    if(isAdmin) {
      btn.classList.add('on'); btn.textContent = '👑 관리자';
      setBtn.style.display = 'flex';
    } else {
      btn.classList.remove('on'); btn.textContent = '🔒 로그인';
      setBtn.style.display = 'none';
    }
  }

  window.openHomeSettings = function() {
    if(!isAdmin) return;
    document.getElementById('setHeroImg').value = homeData.heroImg || '';
    document.getElementById('setYtChannelId').value = homeData.ytChannelId || '';
    document.getElementById('setIsLive').checked = homeData.isLive === true;
    
    const linkArea = document.getElementById('linkSettingsArea');
    let html = '';
    for(let i=0; i<4; i++) {
      const link = homeData.links[i] || {title:'', sub:'', icon:'', url:''};
      html += `
        <div class="link-setting-box">
          <div class="box-title">링크 ${i+1}</div>
          <div style="display:flex; gap:10px; margin-bottom:5px;">
            <input type="text" id="setLinkTitle_${i}" placeholder="제목 (ex: 숲 방송국)" value="${escapeHtml(link.title)}" style="flex:1; padding:8px; border-radius:6px; border:1px solid #ccc;">
            <input type="text" id="setLinkSub_${i}" placeholder="설명 (ex: 생방송 보러가기)" value="${escapeHtml(link.sub)}" style="flex:1; padding:8px; border-radius:6px; border:1px solid #ccc;">
          </div>
          <input type="text" id="setLinkIcon_${i}" placeholder="아이콘(로고) 이미지 URL" value="${escapeHtml(link.icon)}" style="width:100%; margin-bottom:5px; padding:8px; border-radius:6px; border:1px solid #ccc; box-sizing:border-box;">
          <input type="text" id="setLinkUrl_${i}" placeholder="클릭 시 이동할 주소 (URL)" value="${escapeHtml(link.url)}" style="width:100%; padding:8px; border-radius:6px; border:1px solid #ccc; box-sizing:border-box;">
        </div>
      `;
    }
    linkArea.innerHTML = html;

    document.getElementById('homeSettingsModal').style.display = 'flex';
  };

  window.closeHomeSettings = function() { document.getElementById('homeSettingsModal').style.display = 'none'; };

  window.saveHomeSettings = async function() {
    if(!isAdmin) return;
    
    const newLinks = [];
    for(let i=0; i<4; i++) {
      newLinks.push({
        title: document.getElementById(`setLinkTitle_${i}`).value.trim(),
        sub: document.getElementById(`setLinkSub_${i}`).value.trim(),
        icon: document.getElementById(`setLinkIcon_${i}`).value.trim(),
        url: document.getElementById(`setLinkUrl_${i}`).value.trim()
      });
    }

    const newData = {
      isLive: document.getElementById('setIsLive').checked,
      heroImg: document.getElementById('setHeroImg').value.trim(),
      ytChannelId: document.getElementById('setYtChannelId').value.trim(),
      links: newLinks
    };

    try {
      await setDoc(homeRef, newData, { merge: true });
      window.closeHomeSettings();
      alert("홈페이지 설정이 완벽하게 저장되었습니다!");
    } catch(e) { alert("저장 실패!"); }
  };

  updateAdminUI();
</script>
</body>
</html>
